<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Song 🎶</title>
    <!-- Importar a fonte moderna Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Biblioteca de Confetis -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- INTRO SCREEN -->
    <div id="intro-screen" class="screen card intro-card">
        <div class="intro-content">
            <h1 class="glow-title">🎵 Guess The Song 🎵</h1>
            <button onclick="enterGame()" class="play-btn intro-btn-large">Start Game 🚀</button>
            <div class="creator-tag-below">✨ Created by <strong>Filipa Martins</strong> ✨</div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen card" style="display: none;">
        <h1>🎵 Welcome! 🎵</h1>
        <p>Enter your name to start playing:</p>
        <input type="text" id="username-input" placeholder="Your name..." maxlength="15">
        <br>
        <button onclick="startGame()" class="play-btn">Next ➡️</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen card" style="display: none;">
        <h1>🎧 Guess The Song 🎧</h1>

        <!-- Botão Play Song em cima, maior e em destaque -->
        <div class="top-play-container">
            <audio id="song" onplay="startEqualizer()" onpause="stopEqualizer()" onended="stopEqualizer()"></audio>
            <button onclick="playSong()" class="play-btn large-play-btn spotify-container">
                <span>▶️ Play Song</span>
                <div id="equalizer" class="equalizer paused">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </button>
        </div>

        <!-- Informações do Jogador, Score e Vidas -->
        <h2>Player: <span id="player-display"></span> | Score: <span id="score">0</span> | Lives: <span id="lives">❤️❤️❤️</span></h2>
        
        <hr class="divider">
        
        <!-- Conteúdo do nível que desliza -->
        <div id="level-content-wrapper" class="level-transition">
            <h3 id="question-title">What song is this?</h3>
            
            <div id="options" class="options-grid">
                <button onclick="checkAnswer(0)" id="btn0" class="square-btn"></button>
                <button onclick="checkAnswer(1)" id="btn1" class="square-btn"></button>
                <button onclick="checkAnswer(2)" id="btn2" class="square-btn"></button>
                <button onclick="checkAnswer(3)" id="btn3" class="square-btn"></button>
            </div>
        </div>

        <p id="mensagem" class="msg"></p>
    </div>

    <!-- GAME OVER / LEADERBOARD SCREEN -->
    <div id="scoreboard-screen" class="screen card" style="display: none;">
        <h2 id="final-msg">Game Over!</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        
        <h3>🏆 Leaderboard 🏆</h3>
        <ol id="leaderboard-list">
            <!-- Preenchido dinamicamente -->
        </ol>

        <br>
        <button onclick="location.reload()" class="play-btn">Play Again 🔄</button>
    </div>

    <!-- Contentor global para animações flutuantes (corações a cair) -->
    <div id="animation-container"></div>

    <script src="script.js"></script>
</body>
</html>
