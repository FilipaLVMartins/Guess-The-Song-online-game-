<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Song</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Game: Guess The Song!</h1>
    <h2>Score: <span id="score">0</span> | Lives: <span id="lives">3</span></h2>

    <!-- O leitor de áudio -->
    <audio id="song"></audio>

    <button onclick="playSong()" class="play-btn">▶️ Play Song</button>
    
    <hr>
    
    <h3 id="question-title">What song is this?</h3>
    <div id="options">
        <button onclick="checkAnswer(0)" id="btn0"></button>
        <button onclick="checkAnswer(1)" id="btn1"></button>
        <button onclick="checkAnswer(2)" id="btn2"></button>
        <button onclick="checkAnswer(3)" id="btn3"></button>
    </div>

    <p id="mensagem" class="msg"></p>
    
    <script src="script.js"></script>
</body>
</html>
